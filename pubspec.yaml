# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: bahantabay
description: A community flood reporting and safer route planning app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. The course template keeps it enabled in deployed builds.
  device_preview: ^1.3.1
  supabase_flutter: ^2.17.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - "docs/assets/Home Page Logo.png"
    - "docs/assets/Sign Up Page Logo.png"

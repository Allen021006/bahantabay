name: Deploy web demo

# Builds the Flutter web app and publishes it to GitHub Pages on every push
# to main.
#
# Before this works:
# Repository Settings > Pages > Build and deployment > Source: GitHub Actions
#
# Required repository secrets:
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
#
# The Supabase publishable key is client-side configuration, not a privileged
# service_role secret. Database access must still be protected by RLS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -f pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pubspec.yaml found. Deployment skipped."
          fi

          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::Repository is private. GitHub Pages deployment is skipped."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - if: steps.check.outputs.ready == 'true'
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - if: steps.check.outputs.ready == 'true'
        run: flutter test
        continue-on-error: true

      - name: Build web
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
